[package]
name = "waste-x-desktop"
version = "0.1.0"
description = "Waste X Desktop"
authors = ["Waste X"]
edition = "2021"

[lib]
name = "waste_x_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
hex = "0.4.3"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
rand = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
